[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveryai"
version = "2.0.0"
description = "RecoveryAI - autonomous, governed revenue recovery agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
# The default run is key-free and network-free, and stays that way: the smoke
# tests are opted *into* with `-m llm_smoke`, never merely present. A suite that
# needs a credential to pass is a suite people stop running.
addopts = "-m 'not llm_smoke'"
markers = [
    "llm_smoke: hits the real LLM provider; needs GEMINI_API_KEY and network. Excluded by default.",
]
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's Depends()/Body() in defaults is the framework's idiom, not a bug.
    "B008",
    # `str, Enum` rather than `StrEnum`: these values are compared against and
    # serialised as plain strings all over the codebase, and StrEnum changes
    # what bare `str(member)` returns. No benefit, real risk.
    "UP042",
]
